name: Rotate Artifact Gate Password

# The rfp-assessment-calculator page is locked behind a client-side password
# gate. This workflow rotates that password every 10 US business days.
#
# It runs every weekday morning and does nothing unless the rotation is due, so
# a missed run (outage, holiday, disabled Actions) is picked up the next day
# rather than silently skipping a cycle.
#
# The password itself is never stored or printed. It is derived from the
# GATE_MASTER_KEY secret plus the public rotation index in
# .gate-rotation/<artifact>.json - see tools/rotate_gate_password.py.

on:
  schedule:
    # 15:00 UTC = 08:00 PDT / 07:00 PST, Monday-Friday.
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rotate now even if the interval has not elapsed'
        type: boolean
        default: false
      bootstrap_from_ref:
        description: 'One-time setup / recovery: git ref holding the UNENCRYPTED page to lock at rotation #1'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gate-password-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: bootstrap reads the plaintext page from an older ref.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet 'cryptography>=42'

      - name: Verify rotation key is configured
        env:
          GATE_MASTER_KEY: ${{ secrets.GATE_MASTER_KEY }}
        run: |
          if [ -z "$GATE_MASTER_KEY" ]; then
            echo "::error::GATE_MASTER_KEY is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Bootstrap the gate from an unencrypted revision
        id: bootstrap
        if: inputs.bootstrap_from_ref != ''
        env:
          GATE_MASTER_KEY: ${{ secrets.GATE_MASTER_KEY }}
          REF: ${{ inputs.bootstrap_from_ref }}
        run: |
          git show "$REF:rfp-assessment-calculator/index.html" > /tmp/plaintext.html
          python tools/rotate_gate_password.py bootstrap --plaintext /tmp/plaintext.html
          {
            echo "changed=true"
            echo "index=1"
          } >> "$GITHUB_OUTPUT"

      - name: Rotate if due
        id: rotate
        if: inputs.bootstrap_from_ref == ''
        env:
          GATE_MASTER_KEY: ${{ secrets.GATE_MASTER_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          args=""
          [ "$FORCE" = "true" ] && args="--force"
          set +e
          python tools/rotate_gate_password.py rotate $args
          status=$?
          set -e
          # Exit 3 is the "not due yet" signal, not a failure.
          if [ "$status" -eq 3 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"

      - name: Publish the re-encrypted page
        id: commit
        if: steps.rotate.outputs.changed == 'true' || steps.bootstrap.outputs.changed == 'true'
        env:
          # The default branch requires a pull request (repository ruleset
          # "Protect main - PR required", no bypass actors), so each rotation lands
          # as a short-lived branch that is opened and merged in the same run.
          # Opening that PR needs either "Allow GitHub Actions to create and
          # approve pull requests" (an ORG-level setting for CzarnowskiCollective,
          # currently off) or a GATE_PUSH_TOKEN secret holding a token with
          # contents+pull-requests write, which acts as a user instead.
          GH_TOKEN: ${{ secrets.GATE_PUSH_TOKEN || github.token }}
          INDEX: ${{ steps.rotate.outputs.index || steps.bootstrap.outputs.index }}
        run: |
          branch="gate-rotation/${INDEX}"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add rfp-assessment-calculator/index.html .gate-rotation/
          git commit -m "chore(rfp-assessment-calculator): rotate gate password (#${INDEX})" \
                     -m "Automated rotation on the 10-business-day schedule."
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(rfp-assessment-calculator): rotate gate password (#${INDEX})" \
            --body "Automated rotation on the 10-business-day schedule. The page was re-encrypted under a freshly derived password; no secret appears in this diff."
          gh pr merge "$branch" --merge --delete-branch
          state=$(gh pr view "$branch" --json state --jq .state)
          if [ "$state" != "MERGED" ]; then
            echo "::error::Rotation branch $branch did not merge (state: $state). The page is re-encrypted there but not published."
            exit 1
          fi

      - name: Report
        if: always()
        env:
          GATE_MASTER_KEY: ${{ secrets.GATE_MASTER_KEY }}
        run: |
          {
            if [ "${{ steps.commit.outcome }}" = "success" ]; then
              echo "### Gate password rotated"
              echo ""
              python tools/rotate_gate_password.py check || true
              echo ""
              echo "The password is not printed here. Derive it from \`GATE_MASTER_KEY\` and the rotation index above."
            else
              echo "### No rotation"
              echo ""
              python tools/rotate_gate_password.py check || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
