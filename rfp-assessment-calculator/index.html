<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RFP Assessment Calculator</title>
<style>
  :root{
    --ink:#15181d; --ink-2:#4a5058; --ink-3:#767d87;
    --paper:#ffffff; --surface:#f6f7f8; --surface-2:#eef0f2;
    --line:#dfe2e6; --line-2:#c9ced4;
    --accent:#0e5c6b; --accent-soft:#e7f1f3; --neg:#9a3320;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--surface);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
  }
  .card{
    width:100%;max-width:400px;background:var(--paper);
    border:1px solid var(--line);border-radius:10px;padding:24px 22px 20px;
    box-shadow:0 1px 2px rgba(21,24,29,.04);
  }
  h1{margin:0 0 6px;font-size:21px;letter-spacing:-.01em;font-weight:650}
  p{margin:0 0 18px;color:var(--ink-2)}
  label{display:block;font-weight:550;margin-bottom:6px}
  input[type=password]{
    width:100%;font:inherit;color:var(--ink);background:var(--paper);
    border:1px solid var(--line-2);border-radius:8px;padding:9px 10px;
  }
  input:focus{outline:2px solid var(--accent-soft);outline-offset:0;border-color:var(--accent)}
  button{
    margin-top:12px;width:100%;font:inherit;font-weight:550;cursor:pointer;
    border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;
    padding:9px 14px;transition:background .12s,transform .06s;
  }
  button:hover{background:#0b4b57}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.55;cursor:default;transform:none}
  .msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--neg)}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:14px;line-height:1.4}
  @media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main class="card">
  <h1>RFP Assessment Calculator</h1>
  <p>This page is locked. Enter the password to open the calculator.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button id="go" type="submit">Unlock</button>
  </form>
  <div class="msg" id="msg" role="alert" aria-live="polite"></div>
  <div class="hint">Stays unlocked in this tab until you close it.</div>
  <noscript><div class="msg">JavaScript is required to open this page.</div></noscript>
</main>

  var SLOT='rfp-assessment-calculator:key';
  var enc=new TextEncoder(),dec=new TextDecoder();
  function $(id){return document.getElementById(id)}
  function b64d(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function b64e(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
  var subtle=(window.crypto&&window.crypto.subtle)||null;

  function deriveKey(pw){
    return subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){

  function decrypt(key){
    return subtle.decrypt({name:'AES-GCM',iv:b64d(DATA.iv)},key,b64d(DATA.ct))

  function reveal(html){document.open();document.write(html);document.close()}
  function remember(key){

  function forget(){try{sessionStorage.removeItem(SLOT)}catch(e){}}
